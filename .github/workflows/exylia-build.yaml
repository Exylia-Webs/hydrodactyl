name: Exylia - Build image

# Builds the Exylia flavour of Hydrodactyl (upstream release + the commits on the `exylia` branch)
# and publishes it to GHCR. Production pins `:exylia` and only updates on `docker compose pull`.
on:
  push:
    branches: [exylia]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: exylia-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tags
        id: meta
        run: |
          base=$(git describe --tags --abbrev=0 --match 'v*')
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${base}-exylia.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.meta.outputs.image }}:exylia
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
