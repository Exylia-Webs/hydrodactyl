name: Exylia - Check upstream release

# Weekly check for a new stable Hydrodactyl release. It only opens an issue: rebasing `exylia`
# onto a new release is done by hand, because releases can carry DB migrations that need a backup first.
on:
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exylia
          fetch-depth: 0

      - name: Compare with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags https://github.com/BlueprintFramework/hydrodactyl.git
          current=$(git describe --tags --abbrev=0 --match 'v*')
          latest=$(gh api repos/BlueprintFramework/hydrodactyl/releases/latest --jq .tag_name)
          echo "current=$current latest=$latest"
          [ "$current" = "$latest" ] && exit 0
          title="Upstream $latest disponible (exylia está en $current)"
          gh issue list --state open --search "$title in:title" --json number --jq 'length' | grep -qx 0 || exit 0
          gh issue create --title "$title" --body "$(cat <<BODY
          Nueva versión estable de Hydrodactyl: https://github.com/BlueprintFramework/hydrodactyl/releases/tag/$latest

          Para actualizar:
          1. \`git fetch upstream --tags && git rebase --onto $latest $current exylia\` y resolver conflictos.
          2. Respaldar la base de datos \`hydrodactyl-db\` en Coolify.
          3. \`git push --force-with-lease\`: Coolify construye y despliega (las migraciones corren al arrancar).
          BODY
          )"
